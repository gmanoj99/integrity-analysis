version: 0.2

# Runs in the CodeBuild "build" project (privileged mode, integrity-review-beta-codebuild
# role). Builds the worker image from the repo Dockerfile, tags it with the
# CodeCommit commit SHA that triggered the pipeline, and pushes it to the
# beta ECR repository. The image tag is the only thing the deploy stage needs.
phases:
  install:
    runtime-versions:
      docker: 20

  pre_build:
    commands:
      - IMAGE_TAG="$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - echo "Logging in to ${ECR_REGISTRY}"
      - aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

  build:
    commands:
      - echo "Building ${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}"
      - docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}" .

  post_build:
    commands:
      - docker push "${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}"
      - printf '%s' "${IMAGE_TAG}" > image_tag.txt
      - echo "Pushed ${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}"

artifacts:
  files:
    - image_tag.txt
