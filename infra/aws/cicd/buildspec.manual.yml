version: 0.2

# Sample "post-infra-deletion" deploy pipeline. Promote this to be the real
# buildspec.yml once infra/aws has been provisioned and removed from the
# repo. Has zero dependency on infra.aws.* -- it only needs the ECR
# repository name and the ECS cluster/service/task-family names, copied by
# hand from the `ecr`/`ecs` blocks of the infra-outputs.json artifact
# produced by `python -m infra.aws.cli outputs` (see buildspec.yml).
#
# Every other setting (env vars, secrets ARNs, task/execution role ARNs,
# cpu/memory, log config) is carried over unchanged from the
# currently-registered task definition, so it is never hand-duplicated here
# and can't drift out of sync with what was actually provisioned.
phases:
  install:
    runtime-versions:
      docker: 20
    commands:
      - export AWS_REGION="ap-south-1"
      - export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      # Copied from infra-outputs.json's "ecr"/"ecs" blocks:
      - export ECR_REPOSITORY_NAME="nw-assessments-ai-analysis-beta-worker"
      - export ECS_CLUSTER="nw-assessments-ai-analysis-beta-cluster"
      - export ECS_SERVICE="nw-assessments-ai-analysis-beta-worker-service"
      - export TASK_FAMILY="nw-assessments-ai-analysis-beta-worker"

  build:
    commands:
      - aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
      - docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}" .
      - docker push "${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}"

      # Patch only the image URI on the currently-registered task definition;
      # everything else (env vars, secrets, role ARNs, cpu/memory, log
      # config) is carried over unchanged.
      - aws ecs describe-task-definition --task-definition "${TASK_FAMILY}" --query 'taskDefinition' > task-def.json
      - >
        jq --arg IMAGE "${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}"
        '.containerDefinitions[0].image = $IMAGE
         | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)'
        task-def.json > new-task-def.json
      - NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
      - aws ecs update-service --cluster "${ECS_CLUSTER}" --service "${ECS_SERVICE}" --task-definition "${NEW_TASK_DEF_ARN}"

  post_build:
    commands:
      - aws ecs wait services-stable --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}"

# Note: relies on `jq` being present in the CodeBuild image. If the chosen
# build image doesn't bundle it, add an install step appropriate for that
# image (e.g. `yum install -y jq` on Amazon-Linux-based images).
