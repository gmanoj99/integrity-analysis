version: 0.2

# Runs entirely in admins CodeBuild project (the provisioner role, which also
# carries infrastructure_provisioner_policy). Reconciles the beta stack via
# this repo's own provisioner, then builds and pushes the worker image, then
# re-applies so the ECS task definition/service point at the new image.
# Two "apply" calls are intentional: the first ensures the ECR repository
# exists before the docker push; the second registers the task definition
# revision that references the freshly pushed image tag.
phases:
  install:
    runtime-versions:
      python: 3.11
      docker: 20
    commands:
      - pip install --no-cache-dir .
      - export AWS_REGION="ap-south-1"
      - export ECR_REPOSITORY_NAME="integrity-review-beta-worker"
      - export CONFIG="infra/aws/config/beta.json"
      - export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION}"

  build:
    commands:
      - python -m infra.aws.cli bootstrap --config "${CONFIG}" --account-id "${AWS_ACCOUNT_ID}"
      - python -m infra.aws.cli apply --config "${CONFIG}" --account-id "${AWS_ACCOUNT_ID}" --image-tag "${IMAGE_TAG}" --yes
      - aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
      - docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}" .
      - docker push "${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}"
      - python -m infra.aws.cli apply --config "${CONFIG}" --account-id "${AWS_ACCOUNT_ID}" --image-tag "${IMAGE_TAG}" --yes

  post_build:
    commands:
      - python -m infra.aws.cli status --config "${CONFIG}" --account-id "${AWS_ACCOUNT_ID}" --deep
